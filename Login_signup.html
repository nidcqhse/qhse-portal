<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ورود / ثبت نام</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 40px;
      height: 100vh;
    }

    .container {
      width: 360px;
      background: #fff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      background: #f1f1f1;
      padding: 5px;
      border-radius: 15px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 12px;
      transition: 0.2s;
    }

    .tab.active {
      background: #4f46e5;
      color: #fff;
    }

    .hidden { display: none; }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .msg { color: red; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">

  <!-- تب‌ها در بالای صفحه برای انتخاب ورود یا ثبت‌نام -->
  <div class="tabs">
    <div id="loginTab" class="tab active" onclick="switchTab('login')">ورود</div>
    <div id="signupTab" class="tab" onclick="switchTab('signup')">ثبت نام</div>
  </div>

  <!-- فرم ورود -->
  <div id="login">
    <input id="loginEmail" placeholder="ایمیل">
    <input id="loginPassword" type="password" placeholder="رمز عبور">
    <button onclick="login()">ورود</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <!-- فرم ثبت‌نام -->
  <div id="signup" class="hidden">
    <input id="signupName" placeholder="نام و نام خانوادگی">
    <input id="signupEmail" placeholder="ایمیل">
    <input id="signupPassword" type="password" placeholder="رمز عبور">
    <button onclick="signup()">ثبت نام</button>
    <div id="signupMsg" class="msg"></div>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD7HzEyVAnHpcODMr3IfydhbhB1azw1zDM",
  authDomain: "qhse-mannan.firebaseapp.com",
  projectId: "qhse-mannan",
  storageBucket: "qhse-mannan.appspot.com",
  messagingSenderId: "690361449144",
  appId: "1:690361449144:web:14e3e906def1c4794a124d",
  measurementId: "G-TEDXLVZ4CJ"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function switchTab(tab) {
  document.getElementById('login').classList.toggle('hidden', tab !== 'login');
  document.getElementById('signup').classList.toggle('hidden', tab !== 'signup');
  document.getElementById('loginTab').classList.toggle('active', tab === 'login');
  document.getElementById('signupTab').classList.toggle('active', tab === 'signup');
}

async function signup(){
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const pass = document.getElementById('signupPassword').value;
  const msg = document.getElementById('signupMsg');

  msg.textContent = "";

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await db.collection('users').doc(cred.user.uid).set({
      name: name,
      email: email,
      approved: false,
      createdAt: new Date()
    });

    msg.style.color = "green";
    msg.textContent = "ثبت‌نام انجام شد. منتظر تأیید مدیر باشید.";

    await auth.signOut();
  }
  catch(e){ msg.textContent = e.message; }
}

async function login(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');

  msg.textContent = "";

  try {
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    const doc = await db.collection('users').doc(cred.user.uid).get();

    if (!doc.exists || doc.data().approved === false){
      msg.textContent = "حساب شما هنوز تأیید نشده است.";
      await auth.signOut();
      return;
    }

    window.location.href = "dashboard.html";
  }
  catch(e){ msg.textContent = e.message; }
}
</script>

</body>
</html>
